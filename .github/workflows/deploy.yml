name: Deploy PakDrive365 to GoDaddy

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    name: Generate config + Deploy over FTP
    runs-on: ubuntu-latest

    steps:
      - name: Get the latest code
        uses: actions/checkout@v4

      - name: Generate real config.php (public & admin)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          python3 -c "
          import os

          def replace_placeholders(template_path, output_path):
              with open(template_path, 'r') as f:
                  content = f.read()
              content = content.replace('__DB_HOST__', os.environ['DB_HOST'])
              content = content.replace('__DB_USER__', os.environ['DB_USER'])
              content = content.replace('__DB_PASS__', os.environ['DB_PASS'])
              content = content.replace('__DB_NAME__', os.environ['DB_NAME'])
              with open(output_path, 'w') as f:
                  f.write(content)

          replace_placeholders('carrental-updated/includes/config.template.php', 'carrental-updated/includes/config.php')
          replace_placeholders('carrental-updated/admin/includes/config.template.php', 'carrental-updated/admin/includes/config.php')
          "

      - name: Upload to GoDaddy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: carrental-updated/
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/config.template.php